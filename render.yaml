services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: hackathon-radar-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false

  # 2. React + Vite Frontend (Static Site)
  - type: web
    name: hackathon-radar-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hackathon-radar-backend
          envVarKey: RENDER_EXTERNAL_URL
        # This automatically pulls the live backend URL during the frontend build!
